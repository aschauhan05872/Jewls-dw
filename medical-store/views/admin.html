<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Dashboard | Med Doorshipp</title>
  <link rel="stylesheet" href="/css/luxury.css">
</head>
<body>
  <!-- HEADER -->
  <main class="admin-main">
    <div class="container-shell">
      <h1 class="admin-page-title">Executive Distribution Dashboard</h1>
      <div class="admin-split">
        <section class="admin-panel" aria-label="Inventory management">
          <h2>Add Medicine</h2>
          <p class="admin-help">Enter prices in <strong>USD</strong> for the default <strong>Pack of 180</strong>. Pack of 90 and 360 are calculated automatically on the storefront.</p>
          <form action="/admin/add-product" method="POST" enctype="multipart/form-data">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
            <label for="original_price_usd">Original Price (USD)</label>
            <input type="number" id="original_price_usd" name="original_price_usd" step="0.01" min="0" required>
            <label for="price_usd">Discounted Price (USD)</label>
            <input type="number" id="price_usd" name="price_usd" step="0.01" min="0" required>
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="prescription">Prescription</option>
              <option value="pain-relief">Pain Relief</option>
              <option value="wellness">Wellness</option>
            </select>
            <label for="dosage_strength">Dosage Strength</label>
            <input type="text" id="dosage_strength" name="dosage_strength" required>
            <label for="description">Description</label>
            <textarea id="description" name="description" required></textarea>
            <label for="precautions">Medical Precautions</label>
            <textarea id="precautions" name="precautions" required></textarea>
            <label for="image">Product Image</label>
            <input type="file" id="image" name="image" accept="image/*">
            <button type="submit">Add to Catalog</button>
          </form>
        </section>
        <section class="admin-panel" aria-label="Orders">
          <h2>Active Orders</h2>
          <table class="admin-table">
            <thead><tr><th>ID</th><th>Time</th><th>Customer</th><th>Email</th><th>Phone</th><th>Ship To</th><th>Product</th><th>Price (USD)</th><th>PID</th></tr></thead>
            <tbody><!-- LEADS_PLACEHOLDER --></tbody>
          </table>
        </section>
      </div>
    </div>
  </main>
  <!-- FOOTER -->
</body>
</html>
