<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrative Entrance | Med Doorshipp</title>
  <link rel="stylesheet" href="/css/luxury.css">
</head>
<body>
  <nav class="top-nav" aria-label="Primary navigation">
    <div class="top-nav-inner">
      <a class="brand-logo" href="/">Med <span>Doorshipp</span></a>
    </div>
  </nav>

  <main class="login-page">
    <div class="login-box">
      <h1>Administrative Entrance</h1>
      <p>Authorized personnel only. Enter credentials to access the executive distribution dashboard.</p>

      <form class="checkout-form" action="/admin-login" method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit">Authenticate</button>
      </form>

      <a class="back-link" href="/">Return to clinical catalog</a>
    </div>
  </main>
</body>
</html>
