<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Med Doorshipp</title>
  <link rel="stylesheet" href="/css/luxury.css">
</head>
<body>
  <!-- HEADER -->

  <main class="checkout-page">
    <div class="container-shell">
      <h1>Checkout</h1>
      <p class="editorial-lead">Complete your pharmacy dispensation and door-delivery details. Our team will contact you to finalize your order securely.</p>
      <div class="checkout-layout">
        <aside class="checkout-summary" aria-label="Order summary">
          <h2>Your Selection</h2>
          <!-- ORDER_SUMMARY -->
        </aside>
        <div class="checkout-main">
          <form class="checkout-form" id="checkout-form" action="/submit-order" method="POST">
            <input type="hidden" id="product_id" name="product_id" value="<!-- PRODUCT_ID -->">

            <section class="form-section" aria-labelledby="contact-heading">
              <h2 id="contact-heading" class="form-section-title">Contact</h2>
              <div class="form-grid form-grid-2">
                <div class="form-grid-span-2"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" required autocomplete="email"></div>
                <div class="form-grid-span-2"><label for="contact_number" class="form-label">Phone</label><input type="tel" id="contact_number" name="contact_number" required autocomplete="tel"></div>
                <div class="form-grid-span-2"><label for="secondary_phone" class="form-label">Secondary phone (optional)</label><input type="tel" id="secondary_phone" name="secondary_phone" autocomplete="tel"></div>
              </div>
            </section>

            <section class="form-section" aria-labelledby="shipping-heading">
              <h2 id="shipping-heading" class="form-section-title">Shipping Address</h2>
              <div class="form-grid form-grid-2">
                <div><label for="first_name" class="form-label">First name</label><input type="text" id="first_name" name="first_name" required autocomplete="shipping given-name"></div>
                <div><label for="last_name" class="form-label">Last name</label><input type="text" id="last_name" name="last_name" required autocomplete="shipping family-name"></div>
                <div class="form-grid-span-2"><label for="shipping_street" class="form-label">Address</label><input type="text" id="shipping_street" name="shipping_street" required autocomplete="shipping address-line1"></div>
                <div class="form-grid-span-2"><label for="shipping_line2" class="form-label">Apartment, suite, etc. (optional)</label><input type="text" id="shipping_line2" name="shipping_line2" autocomplete="shipping address-line2"></div>
                <div><label for="shipping_city" class="form-label">City</label><input type="text" id="shipping_city" name="shipping_city" required autocomplete="shipping address-level2"></div>
                <div><label for="shipping_state" class="form-label">State</label><select id="shipping_state" name="shipping_state" required><option value="">Select state</option><!-- US_STATES_OPTIONS --></select></div>
                <div><label for="shipping_postal" class="form-label">ZIP code</label><input type="text" id="shipping_postal" name="shipping_postal" required pattern="\d{5}(-\d{4})?"></div>
                <div><label for="shipping_country" class="form-label">Country</label><input type="text" id="shipping_country" name="shipping_country" value="United States" readonly></div>
              </div>
            </section>

            <section class="form-section billing-section" aria-labelledby="billing-heading">
              <h2 id="billing-heading" class="form-section-title">Billing Address</h2>
              <input type="checkbox" id="billing_same_as_shipping" name="billing_same_as_shipping" class="billing-same-toggle" checked>
              <label class="checkbox-label" for="billing_same_as_shipping"><span>Billing address same as shipping</span></label>
              <div id="billing-fields" class="billing-fields">
                <div class="form-grid form-grid-2" style="margin-top:1.5rem;">
                  <div><label for="billing_first_name" class="form-label">First name</label><input type="text" id="billing_first_name" name="billing_first_name"></div>
                  <div><label for="billing_last_name" class="form-label">Last name</label><input type="text" id="billing_last_name" name="billing_last_name"></div>
                  <div class="form-grid-span-2"><label for="billing_street" class="form-label">Address</label><input type="text" id="billing_street" name="billing_street"></div>
                  <div class="form-grid-span-2"><label for="billing_line2" class="form-label">Apartment, suite, etc.</label><input type="text" id="billing_line2" name="billing_line2"></div>
                  <div><label for="billing_city" class="form-label">City</label><input type="text" id="billing_city" name="billing_city"></div>
                  <div><label for="billing_state" class="form-label">State</label><select id="billing_state" name="billing_state"><option value="">Select state</option><!-- US_STATES_OPTIONS --></select></div>
                  <div><label for="billing_postal" class="form-label">ZIP code</label><input type="text" id="billing_postal" name="billing_postal"></div>
                </div>
              </div>
            </section>

            <section class="form-section">
              <h2 class="form-section-title">Shipping Method</h2>
              <label class="shipping-option"><input type="radio" name="shipping_method" value="standard" checked><span><span class="shipping-option-title">Standard Shipping</span><span class="shipping-option-desc">Delivery estimate provided when your order ships.</span></span></label>
            </section>

            <section class="form-section">
              <h2 class="form-section-title">Order Notes</h2>
              <textarea id="order_notes" name="order_notes" rows="4" placeholder="Delivery notes or special instructions"></textarea>
            </section>

            <section class="form-section">
              <h2 class="form-section-title">Before You Continue</h2>
              <label class="checkbox-label"><input type="checkbox" id="terms_accepted" name="terms_accepted" required><span>I agree to the <a href="/terms" class="text-link">Terms</a>, <a href="/privacy" class="text-link">Privacy Policy</a>, and <a href="/refund-policy" class="text-link">Refund Policy</a>.</span></label>
              <label class="checkbox-label muted" style="margin-top:1rem;"><input type="checkbox" id="marketing_consent" name="marketing_consent"><span>Send me occasional wellness updates from Med Doorshipp.</span></label>
            </section>

            <button type="submit" class="btn-primary checkout-submit">Complete Your Order Request</button>
          </form>
        </div>
      </div>
      <a class="back-link" href="/cart">Return to cart</a>
    </div>
  </main>

  <!-- FOOTER -->
</body>
</html>
