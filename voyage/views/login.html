<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Voyage Jewelry</title>
  <link rel="stylesheet" href="/css/luxury.css">
</head>
<body>
  <nav class="top-nav"><div class="top-nav-inner"><a class="brand-logo" href="/">Voyage <span>Jewelry</span></a></div></nav>
  <main class="login-page">
    <div class="login-box">
      <h1>Staff Login</h1>
      <p>Authorized personnel only. Access the inventory and order management dashboard.</p>
      <form class="checkout-form" action="/admin-login" method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Sign In</button>
      </form>
      <a class="back-link" href="/">Return to collection</a>
    </div>
  </main>
</body>
</html>
